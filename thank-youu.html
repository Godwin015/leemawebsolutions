<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Application Submitted | Leema Web Solutions</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Auto Redirect After 5 Seconds (UNCHANGED) -->
<meta http-equiv="refresh" content="5;url=https://leemawebsolutions.net">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #050505;
    --bg-card: rgba(15, 15, 20, 0.9);
    --accent-cyan: #00f3ff;
    --text-main: #e0e0e0;
    --text-dim: #a0a0a0;
    --glow: 0 0 15px rgba(0, 243, 255, 0.3);
    --nav-height: 80px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Cyber Grid Background */
.cyber-grid {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image:
        linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: -1;
    mask-image: radial-gradient(circle at center, black, transparent 90%);
}

/* Navigation */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 8%;
    height: var(--nav-height);
    background: rgba(5, 5, 5, 0.95);
    backdrop-filter: blur(10px);
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.logo-container {
    display: flex;
    align-items: center;
    text-decoration: none;
}

.logo-img {
    height: 50px;
    margin-right: 15px;
    filter: drop-shadow(0 0 5px rgba(0, 243, 255, 0.5));
}

.logo-text {
    font-size: 1.2rem;
    font-weight: bold;
    color: var(--accent-cyan);
    letter-spacing: 2px;
    display: flex;
    flex-direction: column;
    line-height: 1.1;
}

.logo-text .sub {
    font-size: 0.7rem;
    font-weight: 300;
    color: var(--text-main);
}

/* Content */
.wrapper {
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: var(--nav-height);
    padding: 20px;
}

.container {
    padding: 50px;
    border: 1px solid rgba(0, 243, 255, 0.2);
    background: var(--bg-card);
    box-shadow: var(--glow);
    border-radius: 8px;
    max-width: 600px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(5px);
}

/* Animated Icon */
.checkmark-circle {
    width: 100px;
    height: 100px;
    margin: 0 auto 25px;
}

.circle {
    stroke: var(--accent-cyan);
    stroke-width: 4;
    fill: none;
    stroke-dasharray: 314;
    stroke-dashoffset: 314;
    animation: draw-circle 1s ease-out forwards;
}

.check {
    stroke: var(--accent-cyan);
    stroke-width: 4;
    fill: none;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: draw-check 0.8s 1s ease-out forwards;
}

@keyframes draw-circle { to { stroke-dashoffset: 0; } }
@keyframes draw-check { to { stroke-dashoffset: 0; } }

h1 {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent-cyan);
    margin-bottom: 20px;
    font-size: 1.4rem;
}

p {
    color: var(--text-dim);
    margin-bottom: 20px;
    line-height: 1.6;
}

#countdown {
    color: var(--accent-cyan);
    font-weight: bold;
}

.btn {
    padding: 12px 30px;
    border: 1px solid var(--accent-cyan);
    background: transparent;
    color: var(--accent-cyan);
    font-family: 'JetBrains Mono', monospace;
    text-decoration: none;
    transition: 0.3s;
    font-size: 0.8rem;
    display: inline-block;
    border-radius: 4px;
}

.btn:hover {
    background: var(--accent-cyan);
    color: #000;
    box-shadow: var(--glow);
}

/* Footer */
footer {
    padding: 40px 10%;
    text-align: center;
    border-top: 1px solid rgba(255,255,255,0.05);
    color: var(--text-dim);
    font-size: 0.8rem;
}
</style>
</head>

<body>

<div class="cyber-grid"></div>

<nav>
    <a href="index3.html" class="logo-container">
        <img src="lws_logo.png" alt="Leema Logo" class="logo-img">
        <div class="logo-text">
            LEEMA
            <span class="sub">WEB SOLUTIONS</span>
        </div>
    </a>
</nav>

<div class="wrapper">
    <div class="container">

        <div class="checkmark-circle">
            <svg viewBox="0 0 100 100">
                <circle class="circle" cx="50" cy="50" r="50"/>
                <polyline class="check" points="30,55 45,70 75,40"/>
            </svg>
        </div>

        <h1>[ APPLICATION SUCCESSFUL ]</h1>

        <p>
            Thank you for applying to intern with <strong>Leema Web Solutions</strong>.
            Your submission has been securely received and is under review.
        </p>

        <p>
            Redirecting to homepage in
            <span id="countdown">5</span> seconds.
        </p>

        <a href="https://leemawebsolutions.net" class="btn">
            > RETURN NOW
        </a>

    </div>
</div>

<footer>
    © 2026 LEEMA WEB SOLUTIONS
</footer>

<!-- Countdown Script (UNCHANGED LOGIC) -->
<script>
let seconds = 5;
const countdown = document.getElementById("countdown");

const interval = setInterval(() => {
  seconds--;
  countdown.textContent = seconds;
  if (seconds <= 0) {
    clearInterval(interval);
  }
}, 1000);
</script>

</body>
</html>
