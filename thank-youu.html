<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Application Submitted | Leema Web Solutions</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Auto Redirect After 10 Seconds -->
<meta http-equiv="refresh" content="10;url=https://leemawebsolutions.net">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #050505;
    --bg-card: rgba(15, 15, 20, 0.9);
    --accent-cyan: #00f3ff;
    --text-main: #e0e0e0;
    --text-dim: #a0a0a0;
    --glow: 0 0 15px rgba(0, 243, 255, 0.3);
    --nav-height: 80px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Cyber Grid */
.cyber-grid {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image:
        linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: -1;
    mask-image: radial-gradient(circle at center, black, transparent 90%);
}

/* Navigation */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 8%;
    height: var(--nav-height);
    background: rgba(5, 5, 5, 0.95);
    backdrop-filter: blur(10px);
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.logo-container { display: flex; align-items: center; text-decoration: none; }
.logo-img { height: 50px; margin-right: 15px; filter: drop-shadow(0 0 5px rgba(0,243,255,0.5)); }
.logo-text { font-size: 1.2rem; font-weight: bold; color: var(--accent-cyan); letter-spacing: 2px; display: flex; flex-direction: column; }
.logo-text .sub { font-size: 0.7rem; font-weight: 300; color: var(--text-main); }

.nav-toggle {
    display: none;
    background: transparent;
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    padding: 8px 12px;
    cursor: pointer;
    font-family: 'JetBrains Mono';
    font-size: 0.8rem;
    border-radius: 4px;
}

.nav-links { display: flex; list-style: none; gap: 12px; }
.nav-links a {
    text-decoration: none;
    color: var(--text-main);
    font-size: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    padding: 8px 14px;
    border: 1px solid rgba(0,243,255,0.2);
    border-radius: 4px;
    transition: 0.3s;
    text-transform: uppercase;
}
.nav-links a:hover {
    color: var(--accent-cyan);
    border-color: var(--accent-cyan);
    background: rgba(0,243,255,0.05);
    box-shadow: var(--glow);
}

@media (max-width: 768px) {
    nav { padding: 0 5%; }
    .nav-toggle { display: block; }
    .nav-links {
        display: none;
        position: absolute;
        top: var(--nav-height);
        left: 0;
        width: 100%;
        background: rgba(5,5,5,0.98);
        flex-wrap: wrap;
        justify-content: center;
        padding: 20px 10px;
        gap: 10px;
        border-bottom: 1px solid var(--accent-cyan);
    }
    .nav-links.active { display: flex; }
}

/* Content */
.wrapper {
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: var(--nav-height);
    padding: 20px;
}

@keyframes glowPulse {
    0% { box-shadow: 0 0 10px rgba(0,243,255,0.2); }
    50% { box-shadow: 0 0 25px rgba(0,243,255,0.5); }
    100% { box-shadow: 0 0 10px rgba(0,243,255,0.2); }
}

.container {
    padding: 50px;
    border: 1px solid rgba(0,243,255,0.2);
    background: var(--bg-card);
    border-radius: 8px;
    max-width: 600px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(5px);
    animation: glowPulse 4s ease-in-out infinite;
}

h1 {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent-cyan);
    margin-bottom: 20px;
    font-size: 1.4rem;
}

p { color: var(--text-dim); margin-bottom: 20px; }

#countdown { color: var(--accent-cyan); font-weight: bold; }

.cursor {
    display: inline-block;
    margin-left: 4px;
    animation: blink 1s infinite;
}
@keyframes blink {
    0%,50%,100% { opacity: 1; }
    25%,75% { opacity: 0; }
}

.btn {
    padding: 12px 30px;
    border: 1px solid var(--accent-cyan);
    background: transparent;
    color: var(--accent-cyan);
    font-family: 'JetBrains Mono', monospace;
    text-decoration: none;
    transition: 0.3s;
    font-size: 0.8rem;
    border-radius: 4px;
}
.btn:hover {
    background: var(--accent-cyan);
    color: #000;
    box-shadow: var(--glow);
}

footer {
    padding: 40px 10%;
    text-align: center;
    border-top: 1px solid rgba(255,255,255,0.05);
    color: var(--text-dim);
    font-size: 0.8rem;
}
</style>
</head>

<body>

<div class="cyber-grid"></div>

<nav>
    <a href="index3.html" class="logo-container">
        <img src="lws_logo.png" class="logo-img">
        <div class="logo-text">
            LEEMA
            <span class="sub">WEB SOLUTIONS</span>
        </div>
    </a>

    <button class="nav-toggle" id="menu-btn">MENU</button>

    <ul class="nav-links" id="nav-menu">
        <li><a href="index3.html#about">About</a></li>
        <li><a href="index3.html#founder">Leadership</a></li>
        <li><a href="index3.html#services">Services</a></li>
        <li><a href="index3.html#contact">Contact</a></li>
    </ul>
</nav>

<div class="wrapper">
<div class="container">

<h1>
<span id="typing-text"></span><span class="cursor">|</span>
</h1>

<p>
Thank you for applying to intern with <strong>Leema Web Solutions</strong>.
Your submission has been securely received and is under review.
</p>

<p>
Redirecting to homepage in <span id="countdown">10</span> seconds.
</p>

<a href="https://leemawebsolutions.net" class="btn">
> RETURN NOW
</a>

</div>
</div>

<footer>
© 2026 LEEMA WEB SOLUTIONS
</footer>

<script>
let seconds = 10;
const countdown = document.getElementById("countdown");
const interval = setInterval(() => {
  seconds--;
  countdown.textContent = seconds;
  if (seconds <= 0) clearInterval(interval);
}, 1000);
</script>

<script>
const menuBtn = document.getElementById('menu-btn');
const navMenu = document.getElementById('nav-menu');
menuBtn.addEventListener('click', () => {
    navMenu.classList.toggle('active');
    menuBtn.innerText = navMenu.classList.contains('active') ? 'CLOSE [X]' : 'MENU';
});
</script>

<script>
const typingElement = document.getElementById("typing-text");
const finalText = "[ APPLICATION SUCCESSFUL ]";

window.addEventListener("load", () => {
    typingElement.textContent = "Initializing secure connection...";
    setTimeout(() => {
        typingElement.textContent = "";
        let i = 0;
        function type() {
            if (i < finalText.length) {
                typingElement.textContent += finalText.charAt(i);
                i++;
                setTimeout(type, 50);
            }
        }
        type();
    }, 1200);
});
</script>

</body>
</html>
